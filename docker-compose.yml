services:
  # PostgreSQL database (TimescaleDB) — the only containerized service.
  # Everything else (scraper, analyzer, API servers) runs as plain Python
  # processes via ./run.sh. Managed by database/db-docker.sh (./run.sh docker up).
  postgres:
    image: timescale/timescaledb:latest-pg13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news_bias
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
