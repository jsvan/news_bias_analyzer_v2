# Serves the built dashboard and proxies /api/ to the api container.
# This nginx runs INSIDE the web container — it is unrelated to the family
# photo server's nginx on the host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin data path: /api/entities -> http://api:8000/entities.
    # The trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
