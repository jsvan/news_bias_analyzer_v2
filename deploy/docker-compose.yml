# Explicit project name so `docker compose -f .../deploy/docker-compose.yml`
# (e.g. from backup.sh) and `docker compose up` in this dir always address the
# same stack — otherwise the name would be the directory name, "deploy".
name: news_bias

services:
  postgres:
    # Pinned to the exact version of the current data (PG 13.15 / TimescaleDB 2.15.3).
    # PG13 is past EOL — see MIGRATION.md "Upgrading Postgres" for the planned bump.
    # Never use a floating tag: a moved 'latest' can strand or corrupt the data dir.
    image: timescale/timescaledb:2.15.3-pg13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: news_bias
    volumes:
      # Bind mount, NOT a named volume. The July 2026 corpus loss happened because
      # the data lived inside Docker's own storage (a Docker Desktop VM reset
      # destroyed it). A bind mount keeps the data at a real filesystem path that
      # `docker compose down -v`, image resets, and Docker reinstalls cannot touch.
      - ${PGDATA_DIR:-/srv/news_bias/pgdata}:/var/lib/postgresql/data
    ports:
      # Localhost only — the app reaches it over the compose network. Do not
      # expose 5432 publicly.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The whole pipeline: runs the scraper every 30 min, keeps the batch-analyzer
  # daemon alive, runs stats jobs on their schedules.
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: news-bias-app
    command: python -m scheduler.job_scheduler
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/news_bias
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in deploy/.env}
      # Cheapest current OpenAI model ($0.05/$0.40 per M, half that via Batch API).
      # Keep stable across the corpus - model changes shift sentiment scoring.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      # Hard daily ceiling (USD) on estimated OpenAI spend - the analyzer
      # refuses new batch submissions past it (analyzer/config.py cost_limits).
      OPENAI_DAILY_LIMIT: ${OPENAI_DAILY_LIMIT:-50}
      # Code default is 5 (a dev safeguard); production wants the Mac's 500.
      SCRAPER_LIMIT_PER_FEED: ${SCRAPER_LIMIT_PER_FEED:-500}
    volumes:
      # Logs and OpenAI batch files live on the host, not in the container.
      - ${LOGS_DIR:-/srv/news_bias/logs}:/app/logs
      - ${BATCHES_DIR:-/srv/news_bias/batches}:/app/batches
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Extension/dashboard API.
  api:
    image: news-bias-app
    command: uvicorn server.extension_api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/news_bias
    ports:
      # Tailscale + localhost only, never 0.0.0.0: this host has public IPv6
      # addresses and no firewall. If the Tailscale IP isn't up yet at boot the
      # container start fails and docker retries until tailscaled provides it.
      - "127.0.0.1:8000:8000"
      - "100.100.142.12:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Web dashboard: nginx serving the built frontend, proxying /api/ to the api
  # container (see Dockerfile.web / nginx.web.conf). Tailscale-bound like the
  # API; the family photo server's nginx on host port 80 is untouched.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: news-bias-web
    ports:
      - "127.0.0.1:8080:80"
      - "100.100.142.12:8080:80"
    depends_on:
      - api
    restart: unless-stopped
